[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscient-tools"
version = "0.2.0"
description = "Analysis tools for Omniscient Architect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "AI Omniscient Architect Team"},
]
keywords = ["code-analysis", "complexity", "clustering", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "omniscient-core>=0.2.0,<0.3.0",
    "lizard>=1.17.0",
    "blake3>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=7.4.0",
    "mypy>=1.7.0",
    "twine>=5.1.0",
]
clustering = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]
parsing = [
    "tree-sitter>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/moshesham/AI-Omniscient-Architect"
Documentation = "https://github.com/moshesham/AI-Omniscient-Architect/tree/main/packages/tools"
Repository = "https://github.com/moshesham/AI-Omniscient-Architect"
Issues = "https://github.com/moshesham/AI-Omniscient-Architect/issues"

[tool.setuptools]
packages = ["omniscient_tools"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
omniscient_tools = ["py.typed"]
